apiVersion: v1
kind: ConfigMap
metadata:
  name: fiapx-config
  namespace: fiapx
data:
  API_PORT: "8080"
  QUEUE_NAME: "video.process"
  MINIO_BUCKET: "videos"
  MINIO_USE_SSL: "false"
  MINIO_ENDPOINT: "minio:9000"
  JWT_EXPIRATION_HOURS: "24"
  PREFETCH_COUNT: "5"
  POSTGRES_DB: "fiapx"
  POSTGRES_USER: "fiapx"
  RABBITMQ_DEFAULT_USER: "fiapx"

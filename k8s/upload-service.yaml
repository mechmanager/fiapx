apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload-service
  namespace: fiapx
  labels:
    app: upload-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upload-service
  template:
    metadata:
      labels:
        app: upload-service
    spec:
      containers:
        - name: upload-service
          image: ghcr.io/mechmanager/fiapx-upload-service:sha-000000
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: fiapx-shared
            - configMapRef:
                name: fiapx-upload-config
          env:
            - name: POSTGRES_DSN
              value: postgres://fiapx:fiapx123@postgres:5432/fiapx?sslmode=disable
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: fiapx-shared
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: fiapx-shared
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fiapx-secrets
                  key: postgres-password
            - name: RABBITMQ_URL
              value: amqp://fiapx:fiapx123@rabbitmq:5672/
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fiapx-secrets
                  key: rabbitmq-password
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fiapx-secrets
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fiapx-secrets
                  key: minio-secret-key
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: upload-service
  namespace: fiapx
spec:
  selector:
    app: upload-service
  ports:
    - port: 8082
      targetPort: 8082

apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: fiapx
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/mechmanager/fiapx-auth-service:sha-000000
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: fiapx-auth-config
          env:
            - name: POSTGRES_DSN
              value: postgres://fiapx:fiapx123@postgres:5432/fiapxdb?sslmode=disable
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: fiapx-shared
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: fiapx-shared
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fiapx-secrets
                  key: postgres-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fiapx-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: fiapx
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081

apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipeline
  namespace: fiapx
data:
  logstash.conf: |
    input {
      beats {
        port => 5044
      }
    }

    filter {
      if [container][name] {
        mutate {
          copy => { "[container][name]" => "service" }
        }
        mutate {
          gsub => [ "service", "^fiapx-", "" ]
        }
      }

      if [message] =~ /^\{/ {
        json {
          source  => "message"
          target  => "parsed"
        }
      }
    }

    output {
      elasticsearch {
        hosts    => ["http://elasticsearch:9200"]
        index    => "fiapx-logs-%{+YYYY.MM.dd}"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: fiapx
  labels:
    app: logstash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.14.3
          ports:
            - containerPort: 5044
          volumeMounts:
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: pipeline
          configMap:
            name: logstash-pipeline
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: fiapx
spec:
  selector:
    app: logstash
  ports:
    - port: 5044
      targetPort: 5044

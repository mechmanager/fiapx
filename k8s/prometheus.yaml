apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: fiapx
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: api-gateway
        static_configs:
          - targets: ["api-gateway:8080"]

      - job_name: worker
        static_configs:
          - targets: ["worker:9100"]

      - job_name: auth-service
        static_configs:
          - targets: ["auth-service:8081"]

      - job_name: upload-service
        static_configs:
          - targets: ["upload-service:8082"]

      - job_name: status-service
        static_configs:
          - targets: ["status-service:8083"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: fiapx
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=7d"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: fiapx
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090

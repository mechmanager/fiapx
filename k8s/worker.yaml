apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: fiapx
  labels:
    app: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/mechmanager/fiapx-worker:latest
          envFrom:
            - configMapRef:
                name: fiapx-shared
            - configMapRef:
                name: fiapx-worker-config
          env:
            - name: DB_DSN
              value: postgres://fiapx:fiapx123@postgres:5432/fiapx?sslmode=disable
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fiapx-secrets
                  key: postgres-password
            - name: RABBITMQ_URL
              value: amqp://fiapx:fiapx123@rabbitmq:5672/
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fiapx-secrets
                  key: rabbitmq-password
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fiapx-secrets
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fiapx-secrets
                  key: minio-secret-key
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
  namespace: fiapx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

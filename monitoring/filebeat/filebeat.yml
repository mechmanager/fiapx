filebeat.inputs:
  - type: container
    paths:
      - /var/lib/docker/containers/*/*.log
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: true
          add_error_key: false

# Envia para Logstash (que repassa ao Elasticsearch)
output.logstash:
  hosts: ["logstash:5044"]

logging.level: warning

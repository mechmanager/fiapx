input {
  beats {
    port => 5044
  }
}

filter {
  # Extrai o nome do serviço do nome do container Docker (remove prefixo fiapx-)
  if [container][name] {
    mutate {
      copy => { "[container][name]" => "service" }
    }
    mutate {
      gsub => [ "service", "^fiapx-", "" ]
    }
  }

  # Tenta parsear o log como JSON (serviços Go com log estruturado)
  if [message] =~ /^\{/ {
    json {
      source  => "message"
      target  => "parsed"
    }
  }
}

output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    index    => "fiapx-logs-%{+YYYY.MM.dd}"
  }
}

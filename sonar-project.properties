# Configuração do SonarCloud para o projeto FIAP X.
# Configure SONAR_TOKEN como secret no repositório GitHub.
sonar.projectKey=fiapx
sonar.organization=TROQUE_PELA_ORG_DO_SONARCLOUD
sonar.projectName=FIAP X - Processador de Vídeos
sonar.projectVersion=1.0

# Código-fonte de todos os módulos Go.
sonar.sources=api-gateway,auth-service,upload-service,status-service,notification-service,worker

# Exclui entrypoints, mocks, adaptadores de infra, assets, legado e arquivos de infra.
sonar.exclusions=\
  **/cmd/**,\
  **/mocks/**,\
  **/legacy/**,\
  **/web/**,\
  **/vendor/**,\
  **/Dockerfile,\
  **/*.yaml,\
  **/*.yml,\
  **/*.html,\
  **/*.sql,\
  .github/**,\
  k8s/**,\
  scripts/**

# Exclusões de cobertura (adaptadores que precisam de serviços reais).
sonar.coverage.exclusions=\
  **/cmd/**,\
  **/mocks/**,\
  **/repository/**,\
  **/storage/**,\
  **/queue/**,\
  **/cache/**,\
  **/consumer/**,\
  **/notification/**

# Exclusões de duplicação: adaptadores de infra e config são necessariamente
# similares entre serviços por design (ports & adapters).
sonar.cpd.exclusions=\
  **/repository/**,\
  **/storage/**,\
  **/queue/**,\
  **/cache/**,\
  **/config/**,\
  **/consumer/**,\
  **/middleware/**

# Relatórios de cobertura de todos os módulos.
sonar.go.coverage.reportPaths=\
  api-gateway/coverage.out,\
  auth-service/coverage.out,\
  upload-service/coverage.out,\
  status-service/coverage.out,\
  notification-service/coverage.out,\
  worker/coverage.out

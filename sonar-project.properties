# Configuração do SonarCloud para o projeto FIAP X.
# Configure SONAR_TOKEN como secret no repositório GitHub.
sonar.projectKey=fiapx
sonar.organization=TROQUE_PELA_ORG_DO_SONARCLOUD
sonar.projectName=FIAP X - Processador de Vídeos
sonar.projectVersion=1.0

# Código-fonte dos dois módulos Go.
sonar.sources=api-gateway,worker

# Exclui código gerado, entrypoints e adaptadores de infra sem lógica.
sonar.exclusions=\
  **/mocks/**,\
  **/cmd/**,\
  **/legacy/**,\
  **/web/**,\
  **/vendor/**

# Relatórios de cobertura gerados pelo CI.
sonar.go.coverage.reportPaths=\
  api-gateway/coverage.out,\
  worker/coverage.out

# Threshold de cobertura (SonarCloud Quality Gate).
sonar.coverage.exclusions=\
  **/mocks/**,\
  **/cmd/**,\
  **/storage/**,\
  **/queue/**

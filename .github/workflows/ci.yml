name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: "1.25"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/fiapx

jobs:
  # ---------------------------------------------------------------------------
  # Lint e formatação — um job por módulo
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - api-gateway
          - auth-service
          - upload-service
          - status-service
          - notification-service
          - worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: gofmt
        run: |
          bad=$(gofmt -l ./${{ matrix.module }})
          if [ -n "$bad" ]; then
            echo "Arquivos sem formatação gofmt:"
            echo "$bad"
            exit 1
          fi

      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

  # ---------------------------------------------------------------------------
  # Testes e cobertura — um job por módulo
  # ---------------------------------------------------------------------------
  test:
    name: Testes (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: api-gateway
            packages: ./config/... ./middleware/... ./proxy/...
          - module: auth-service
            packages: ./config/... ./domain/... ./service/... ./handler/...
          - module: upload-service
            packages: ./config/... ./domain/... ./service/... ./handler/...
          - module: status-service
            packages: ./config/... ./domain/... ./service/... ./handler/...
          - module: notification-service
            packages: ./config/... ./domain/... ./mailer/...
          - module: worker
            packages: ./config/... ./pipeline/... ./notification/... ./processor/...
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Testes
        working-directory: ${{ matrix.module }}
        run: |
          go test -coverprofile=coverage.out ${{ matrix.packages }}
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,""); print $3}')
          echo "Cobertura ${{ matrix.module }}: ${total}%"
          awk "BEGIN { exit !($total >= 80) }" || \
            (echo "FALHA: cobertura abaixo de 80% ($total%)" && exit 1)

      - name: Upload cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.module }}
          path: ${{ matrix.module }}/coverage.out

  # ---------------------------------------------------------------------------
  # SonarCloud — agrega todos os relatórios de cobertura
  # ---------------------------------------------------------------------------
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download relatórios de cobertura
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---------------------------------------------------------------------------
  # Build Docker — um job por serviço
  # ---------------------------------------------------------------------------
  docker:
    name: Docker (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - upload-service
          - status-service
          - notification-service
          - worker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build (e push apenas em main)
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: "1.25"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/fiapx

jobs:
  # ---------------------------------------------------------------------------
  # Lint e formatação
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - api-gateway
          - auth-service
          - upload-service
          - status-service
          - notification-service
          - worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: gofmt
        run: |
          bad=$(gofmt -l ./${{ matrix.module }})
          if [ -n "$bad" ]; then
            echo "Arquivos sem formatação gofmt:"
            echo "$bad"
            exit 1
          fi

      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

  # ---------------------------------------------------------------------------
  # Testes unitários por módulo
  # ---------------------------------------------------------------------------
  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            api-gateway/go.sum
            auth-service/go.sum
            upload-service/go.sum
            status-service/go.sum
            notification-service/go.sum
            worker/go.sum

      - name: Testes api-gateway
        working-directory: api-gateway
        run: |
          go test -coverprofile=coverage.out \
            ./config/... ./middleware/... ./proxy/...
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,""); print $3}')
          echo "Cobertura api-gateway: ${total}%"
          awk "BEGIN { exit !($total >= 80) }" || \
            (echo "FALHA: cobertura abaixo de 80% ($total%)" && exit 1)

      - name: Testes auth-service
        working-directory: auth-service
        run: |
          go test -coverprofile=coverage.out \
            ./config/... ./domain/... ./service/... ./handler/...
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,""); print $3}')
          echo "Cobertura auth-service: ${total}%"
          awk "BEGIN { exit !($total >= 80) }" || \
            (echo "FALHA: cobertura abaixo de 80% ($total%)" && exit 1)

      - name: Testes upload-service
        working-directory: upload-service
        run: |
          go test -coverprofile=coverage.out \
            ./config/... ./domain/... ./service/... ./handler/...
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,""); print $3}')
          echo "Cobertura upload-service: ${total}%"
          awk "BEGIN { exit !($total >= 80) }" || \
            (echo "FALHA: cobertura abaixo de 80% ($total%)" && exit 1)

      - name: Testes status-service
        working-directory: status-service
        run: |
          go test -coverprofile=coverage.out \
            ./config/... ./domain/... ./service/... ./handler/...
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,""); print $3}')
          echo "Cobertura status-service: ${total}%"
          awk "BEGIN { exit !($total >= 80) }" || \
            (echo "FALHA: cobertura abaixo de 80% ($total%)" && exit 1)

      - name: Testes notification-service
        working-directory: notification-service
        run: |
          go test -coverprofile=coverage.out \
            ./config/... ./domain/... ./mailer/...
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,""); print $3}')
          echo "Cobertura notification-service: ${total}%"
          awk "BEGIN { exit !($total >= 80) }" || \
            (echo "FALHA: cobertura abaixo de 80% ($total%)" && exit 1)

      - name: Testes worker
        working-directory: worker
        run: |
          go test -coverprofile=coverage.out \
            ./config/... ./pipeline/... ./notification/... ./processor/...
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,""); print $3}')
          echo "Cobertura worker: ${total}%"
          awk "BEGIN { exit !($total >= 80) }" || \
            (echo "FALHA: cobertura abaixo de 80% ($total%)" && exit 1)

      - name: Upload relatórios de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            api-gateway/coverage.out
            auth-service/coverage.out
            upload-service/coverage.out
            status-service/coverage.out
            notification-service/coverage.out
            worker/coverage.out

  # ---------------------------------------------------------------------------
  # SonarCloud
  # ---------------------------------------------------------------------------
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download relatórios de cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---------------------------------------------------------------------------
  # Build e push das imagens Docker
  # ---------------------------------------------------------------------------
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - upload-service
          - status-service
          - notification-service
          - worker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build (e push apenas em main)
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Install Dependencies

on:
  workflow_dispatch:
  workflow_call:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: fiapx-cluster
  NAMESPACE: fiapx

jobs:
  install-dependencies:
    name: 🚀 Install Infrastructure Dependencies
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────
      # 1. CHECKOUT
      # ─────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────
      # 2. AWS + KUBECTL
      # ─────────────────────────────────────────
      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: ☸️ Update kubeconfig (EKS)
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      # ─────────────────────────────────────────
      # 3. NAMESPACE
      # ─────────────────────────────────────────
      - name: 📁 Create namespace (idempotent)
        run: |
          kubectl get namespace ${{ env.NAMESPACE }} \
            || kubectl create namespace ${{ env.NAMESPACE }}

      # ─────────────────────────────────────────
      # 4. SECRETS
      # ─────────────────────────────────────────
      - name: 🔐 Create Kubernetes secrets
        run: |
          kubectl create secret generic fiapx-secrets \
            --namespace=${{ env.NAMESPACE }} \
            --from-literal=postgres-password="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=rabbitmq-password="${{ secrets.RABBITMQ_PASSWORD }}" \
            --from-literal=minio-root-user="${{ secrets.MINIO_ROOT_USER }}" \
            --from-literal=minio-root-password="${{ secrets.MINIO_ROOT_PASSWORD }}" \
            --from-literal=jwt-secret="${{ secrets.JWT_SECRET }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # ─────────────────────────────────────────
      # 5. CONFIGMAPS
      # ─────────────────────────────────────────
      - name: 🗂️ Apply shared ConfigMap
        run: |
          kubectl apply -f k8s/configmap.yaml

      # ─────────────────────────────────────────
      # 6. STORAGE CLASS
      # ─────────────────────────────────────────
      - name: 💾 Apply StorageClass (EBS)
        run: |
          kubectl apply -f k8s/storage-class.yaml

          echo "⏳ Waiting for StorageClass to be available..."
          for i in $(seq 1 10); do
            if kubectl get storageclass ebs-sc &>/dev/null; then
              echo "✅ StorageClass ebs-sc ready"
              break
            fi
            echo "  attempt $i/10 – waiting 5s..."
            sleep 5
          done

      # ─────────────────────────────────────────
      # 7. POSTGRESQL
      # ─────────────────────────────────────────
      - name: 🐘 Deploy PostgreSQL
        run: |
          kubectl apply -f k8s/postgres.yaml

      - name: ⏳ Wait for PostgreSQL
        run: |
          echo "⏳ Waiting for PostgreSQL StatefulSet..."
          kubectl rollout status statefulset/postgres \
            --namespace=${{ env.NAMESPACE }} \
            --timeout=300s

          echo "🔍 Checking PostgreSQL pod status..."
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=postgres
          kubectl get pvc  -n ${{ env.NAMESPACE }}

      # ─────────────────────────────────────────
      # 8. RABBITMQ
      # ─────────────────────────────────────────
      - name: 🐰 Deploy RabbitMQ
        run: |
          kubectl apply -f k8s/rabbitmq.yaml

      - name: ⏳ Wait for RabbitMQ
        run: |
          echo "⏳ Waiting for RabbitMQ StatefulSet..."
          kubectl rollout status statefulset/rabbitmq \
            --namespace=${{ env.NAMESPACE }} \
            --timeout=300s

          echo "🔍 Checking RabbitMQ pod status..."
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=rabbitmq

      # ─────────────────────────────────────────
      # 9. MINIO
      # ─────────────────────────────────────────
      - name: 🪣 Deploy MinIO
        run: |
          kubectl apply -f k8s/minio.yaml

      - name: ⏳ Wait for MinIO
        run: |
          echo "⏳ Waiting for MinIO StatefulSet..."
          kubectl rollout status statefulset/minio \
            --namespace=${{ env.NAMESPACE }} \
            --timeout=300s

          echo "🔍 Checking MinIO pod status..."
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=minio

      # ─────────────────────────────────────────
      # 10. REDIS
      # ─────────────────────────────────────────
      - name: 🔴 Deploy Redis
        run: |
          kubectl apply -f k8s/redis.yaml

      - name: ⏳ Wait for Redis
        run: |
          echo "⏳ Waiting for Redis Deployment..."
          kubectl rollout status deployment/redis \
            --namespace=${{ env.NAMESPACE }} \
            --timeout=180s

          echo "🔍 Checking Redis pod status..."
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=redis

      # ─────────────────────────────────────────
      # 11. ELASTICSEARCH
      # ─────────────────────────────────────────
      - name: 🔍 Deploy Elasticsearch
        run: |
          kubectl apply -f k8s/elasticsearch.yaml

      - name: ⏳ Wait for Elasticsearch
        run: |
          echo "⏳ Waiting for Elasticsearch StatefulSet..."
          kubectl rollout status statefulset/elasticsearch \
            --namespace=${{ env.NAMESPACE }} \
            --timeout=300s

          echo "🔍 Checking Elasticsearch pod status..."
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=elasticsearch

      # ─────────────────────────────────────────
      # 12. LOGSTASH
      # ─────────────────────────────────────────
      - name: 📊 Deploy Logstash
        run: |
          kubectl apply -f k8s/logstash.yaml

      - name: ⏳ Wait for Logstash
        run: |
          echo "⏳ Waiting for Logstash Deployment..."
          kubectl rollout status deployment/logstash \
            --namespace=${{ env.NAMESPACE }} \
            --timeout=300s

          echo "🔍 Checking Logstash pod status..."
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=logstash

      # ─────────────────────────────────────────
      # 13. KIBANA
      # ─────────────────────────────────────────
      - name: 📈 Deploy Kibana
        run: |
          kubectl apply -f k8s/kibana.yaml

      - name: ⏳ Wait for Kibana
        run: |
          echo "⏳ Waiting for Kibana Deployment..."
          kubectl rollout status deployment/kibana \
            --namespace=${{ env.NAMESPACE }} \
            --timeout=300s

          echo "🔍 Checking Kibana pod status..."
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=kibana

      # ─────────────────────────────────────────
      # 14. FILEBEAT
      # ─────────────────────────────────────────
      - name: 📂 Deploy Filebeat
        run: |
          kubectl apply -f k8s/filebeat.yaml

      - name: ⏳ Wait for Filebeat
        run: |
          echo "⏳ Waiting for Filebeat DaemonSet..."
          kubectl rollout status daemonset/filebeat \
            --namespace=${{ env.NAMESPACE }} \
            --timeout=180s

          echo "🔍 Checking Filebeat pod status..."
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=filebeat

      # ─────────────────────────────────────────
      # 15. PROMETHEUS
      # ─────────────────────────────────────────
      - name: 📡 Deploy Prometheus
        run: |
          kubectl apply -f k8s/prometheus.yaml

      - name: ⏳ Wait for Prometheus
        run: |
          echo "⏳ Waiting for Prometheus Deployment..."
          kubectl rollout status deployment/prometheus \
            --namespace=${{ env.NAMESPACE }} \
            --timeout=180s

          echo "🔍 Checking Prometheus pod status..."
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=prometheus

      # ─────────────────────────────────────────
      # 16. GRAFANA
      # ─────────────────────────────────────────
      - name: 📉 Deploy Grafana
        run: |
          kubectl apply -f k8s/grafana.yaml

      - name: ⏳ Wait for Grafana
        run: |
          echo "⏳ Waiting for Grafana Deployment..."
          kubectl rollout status deployment/grafana \
            --namespace=${{ env.NAMESPACE }} \
            --timeout=180s

          echo "🔍 Checking Grafana pod status..."
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=grafana

      # ─────────────────────────────────────────
      # 17. RESUMO FINAL
      # ─────────────────────────────────────────
      - name: 📋 Final status summary
        if: always()
        run: |
          echo "════════════════════════════════════"
          echo "  📋 FIAPX Infrastructure Summary   "
          echo "════════════════════════════════════"

          echo ""
          echo "📦 All Pods:"
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide

          echo ""
          echo "💾 PersistentVolumeClaims:"
          kubectl get pvc -n ${{ env.NAMESPACE }}

          echo ""
          echo "🌐 Services:"
          kubectl get svc -n ${{ env.NAMESPACE }}

          echo ""
          echo "🗂️ ConfigMaps:"
          kubectl get configmap -n ${{ env.NAMESPACE }}

          echo ""
          echo "🔐 Secrets:"
          kubectl get secret -n ${{ env.NAMESPACE }}
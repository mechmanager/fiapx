name: Install Dependencies

on:
  workflow_call:        # ← OBRIGATÓRIO para ser chamado por outro workflow
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true
      EKS_CLUSTER_NAME:
        required: true
      POSTGRES_PASSWORD:
        required: true
      RABBITMQ_PASSWORD:
        required: true
      MINIO_ROOT_PASSWORD:
        required: true
      MINIO_ROOT_USER:
        required: true
      JWT_SECRET:
        required: true

  workflow_dispatch:    # ← permite rodar manualmente também

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ secrets.EKS_CLUSTER_NAME }} \
            --region ${{ secrets.AWS_REGION }}

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # NAMESPACE & SECRETS
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Create Namespace and Secrets
        run: |
          kubectl create namespace fiapx --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic app-secrets \
            --namespace fiapx \
            --from-literal=POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
            --from-literal=RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }} \
            --from-literal=MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }} \
            --from-literal=MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }} \
            --from-literal=JWT_SECRET=${{ secrets.JWT_SECRET }} \
            --dry-run=client -o yaml | kubectl apply -f -

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # LIMPEZA DE RECURSOS IMUTÁVEIS
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Cleanup Immutable Resources
        run: |
          echo "🗑️ Removendo StorageClass (campos imutáveis)..."
          kubectl delete storageclass ebs-sc --ignore-not-found

          echo "🗑️ Removendo StatefulSets (mantendo PVCs)..."
          kubectl delete statefulset postgres      -n fiapx --cascade=orphan --ignore-not-found
          kubectl delete statefulset rabbitmq      -n fiapx --cascade=orphan --ignore-not-found
          kubectl delete statefulset minio         -n fiapx --cascade=orphan --ignore-not-found
          kubectl delete statefulset elasticsearch -n fiapx --cascade=orphan --ignore-not-found

          echo "🗑️ Removendo PVCs antigos..."
          kubectl delete pvc postgres-data-postgres-0              -n fiapx --ignore-not-found
          kubectl delete pvc rabbitmq-data-rabbitmq-0              -n fiapx --ignore-not-found
          kubectl delete pvc minio-data-minio-0                    -n fiapx --ignore-not-found
          kubectl delete pvc elasticsearch-data-elasticsearch-0    -n fiapx --ignore-not-found

          echo "⏳ Aguardando limpeza completa..."
          sleep 15

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # STORAGECLASS
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Apply StorageClass
        run: |
          echo "📦 Aplicando StorageClass..."
          kubectl apply -f k8s/storage-class.yaml
          kubectl get storageclass

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # CONFIGMAPS
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Apply ConfigMaps
        run: |
          echo "📋 Aplicando ConfigMaps..."
          kubectl apply -f k8s/postgres-configmap.yaml
          kubectl apply -f k8s/app-configmap.yaml

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # POSTGRESQL
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Deploy PostgreSQL
        run: |
          echo "🐘 Aplicando PostgreSQL..."
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status statefulset/postgres -n fiapx --timeout=300s
          kubectl get pods -n fiapx -l app=postgres
          kubectl get pvc  -n fiapx -l app=postgres

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # RABBITMQ
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Deploy RabbitMQ
        run: |
          echo "🐇 Aplicando RabbitMQ..."
          kubectl apply -f k8s/rabbitmq.yaml
          kubectl rollout status statefulset/rabbitmq -n fiapx --timeout=300s
          kubectl get pods -n fiapx -l app=rabbitmq

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # MINIO
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Deploy MinIO
        run: |
          echo "🗄️ Aplicando MinIO..."
          kubectl apply -f k8s/minio.yaml
          kubectl rollout status statefulset/minio -n fiapx --timeout=300s
          kubectl get pods -n fiapx -l app=minio

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # REDIS
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Deploy Redis
        run: |
          echo "🔴 Aplicando Redis..."
          kubectl apply -f k8s/redis.yaml
          kubectl rollout status deployment/redis -n fiapx --timeout=180s
          kubectl get pods -n fiapx -l app=redis

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # ELASTICSEARCH
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Deploy Elasticsearch
        run: |
          echo "🔍 Aplicando Elasticsearch..."
          kubectl apply -f k8s/elasticsearch.yaml
          kubectl rollout status statefulset/elasticsearch -n fiapx --timeout=300s
          kubectl get pods -n fiapx -l app=elasticsearch

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # LOGSTASH + KIBANA + FILEBEAT
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Deploy Observability Stack
        run: |
          echo "📊 Aplicando Logstash..."
          kubectl apply -f k8s/logstash.yaml
          kubectl rollout status deployment/logstash -n fiapx --timeout=180s

          echo "📊 Aplicando Kibana..."
          kubectl apply -f k8s/kibana.yaml
          kubectl rollout status deployment/kibana -n fiapx --timeout=180s

          echo "📊 Aplicando Filebeat..."
          kubectl apply -f k8s/filebeat.yaml
          kubectl rollout status daemonset/filebeat -n fiapx --timeout=180s

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # PROMETHEUS + GRAFANA
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Deploy Monitoring Stack
        run: |
          echo "📈 Aplicando Prometheus..."
          kubectl apply -f k8s/prometheus.yaml
          kubectl rollout status deployment/prometheus -n fiapx --timeout=180s

          echo "📈 Aplicando Grafana..."
          kubectl apply -f k8s/grafana.yaml
          kubectl rollout status deployment/grafana -n fiapx --timeout=180s

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # VERIFICAÇÃO FINAL
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Final Verification
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅  VERIFICAÇÃO FINAL DO AMBIENTE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          kubectl get storageclass
          kubectl get pvc  -n fiapx
          kubectl get pods -n fiapx
          kubectl get svc  -n fiapx
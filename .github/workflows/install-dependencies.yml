name: Install Dependencies

on:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true
      EKS_CLUSTER_NAME:
        required: true
      POSTGRES_PASSWORD:
        required: true
      RABBITMQ_PASSWORD:
        required: true
      MINIO_ROOT_PASSWORD:
        required: true
      MINIO_ROOT_USER:
        required: true
      JWT_SECRET:
        required: true

  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ secrets.EKS_CLUSTER_NAME }} \
            --region ${{ secrets.AWS_REGION }}

      - name: Ensure CoreDNS Addon
        run: |
          echo "📡 Garantindo CoreDNS no cluster..."

          CLUSTER_VERSION=$(aws eks describe-cluster \
            --name ${{ secrets.EKS_CLUSTER_NAME }} \
            --region ${{ secrets.AWS_REGION }} \
            --query "cluster.version" --output text)

          LATEST_VERSION=$(aws eks describe-addon-versions \
            --addon-name coredns \
            --kubernetes-version $CLUSTER_VERSION \
            --region ${{ secrets.AWS_REGION }} \
            --query 'addons[0].addonVersions[-1].addonVersion' \
            --output text)

          echo "➡️ Usando versão suportada: $LATEST_VERSION"

          if ! aws eks describe-addon --cluster-name ${{ secrets.EKS_CLUSTER_NAME }} --addon-name coredns --region ${{ secrets.AWS_REGION }} >/dev/null 2>&1; then
            aws eks create-addon \
              --cluster-name ${{ secrets.EKS_CLUSTER_NAME }} \
              --addon-name coredns \
              --addon-version $LATEST_VERSION \
              --resolve-conflicts OVERWRITE
          else
            aws eks update-addon \
              --cluster-name ${{ secrets.EKS_CLUSTER_NAME }} \
              --addon-name coredns \
              --addon-version $LATEST_VERSION \
              --resolve-conflicts OVERWRITE
          fi

          echo "⏳ Aguardando addon ficar ativo..."
          aws eks wait addon-active \
            --cluster-name ${{ secrets.EKS_CLUSTER_NAME }} \
            --addon-name coredns \
            --region ${{ secrets.AWS_REGION }}

          echo "✅ CoreDNS ativo, verificando rollout..."
          kubectl rollout status deployment coredns -n kube-system --timeout=300s
          kubectl get pods -n kube-system -l k8s-app=kube-dns
          kubectl get svc kube-dns -n kube-system

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # NAMESPACE & SECRETS
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Create Namespace and Secrets
        run: |
          kubectl create namespace fiapx --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic fiapx-secrets \
            --namespace fiapx \
            --from-literal=postgres-password=${{ secrets.POSTGRES_PASSWORD }} \
            --from-literal=rabbitmq-password=${{ secrets.RABBITMQ_PASSWORD }} \
            --from-literal=minio-access-key=${{ secrets.MINIO_ACCESS_KEY }} \
            --from-literal=minio-secret-key=${{ secrets.MINIO_SECRET_KEY }} \
            --from-literal=jwt-secret=${{ secrets.JWT_SECRET }} \
            --from-literal=smtp-password=${{ secrets.SMTP_PASSWORD }} \
            --from-literal=grafana-admin-password=${{ secrets.GRAFANA_ADMIN_PASSWORD }} \
            --save-config \
            --dry-run=client -o yaml | kubectl apply -f -

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # STORAGECLASS
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Apply StorageClass
        run: |
          echo "📦 Aplicando StorageClass..."
          kubectl apply -f k8s/storage-class.yaml
          kubectl get storageclass

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # CONFIGMAPS
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Apply ConfigMaps
        run: |
          echo "📋 Aplicando ConfigMaps..."
          kubectl apply -f k8s/configmap.yaml
          kubectl get configmaps -n fiapx

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # POSTGRESQL
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Deploy PostgreSQL
        run: |
          echo "🐘 Aplicando PostgreSQL..."
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status statefulset/postgres -n fiapx --timeout=300s
          kubectl get pods -n fiapx -l app=postgres
          kubectl get pvc  -n fiapx -l app=postgres

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # RABBITMQ
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Deploy RabbitMQ
        run: |
          echo "🐇 Aplicando RabbitMQ (StatefulSet + Service)..."
          kubectl apply -f k8s/rabbitmq.yaml
          kubectl rollout status statefulset/rabbitmq -n fiapx --timeout=300s
          kubectl get pods -n fiapx -l app=rabbitmq
          kubectl get svc -n fiapx rabbitmq

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # MINIO
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Deploy MinIO
        run: |
          echo "🗄️ Aplicando MinIO..."
          kubectl apply -f k8s/minio.yaml
          kubectl rollout status statefulset/minio -n fiapx --timeout=300s
          kubectl get pods -n fiapx -l app=minio

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # REDIS
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Deploy Redis
        run: |
          echo "🔴 Aplicando Redis..."
          kubectl apply -f k8s/redis.yaml
          kubectl rollout status deployment/redis -n fiapx --timeout=180s
          kubectl get pods -n fiapx -l app=redis

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # ELASTICSEARCH
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Deploy Elasticsearch
        run: |
          echo "🔍 Aplicando Elasticsearch..."
          kubectl apply -f k8s/elasticsearch.yaml
          kubectl rollout status statefulset/elasticsearch -n fiapx --timeout=300s
          kubectl get pods -n fiapx -l app=elasticsearch

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # LOGSTASH + KIBANA + FILEBEAT
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Deploy Observability Stack
        run: |
          echo "📊 Aplicando Logstash..."
          kubectl apply -f k8s/logstash.yaml
          kubectl rollout status deployment/logstash -n fiapx --timeout=300s

          echo "📊 Aplicando Kibana..."
          kubectl apply -f k8s/kibana.yaml
          kubectl rollout status deployment/kibana -n fiapx --timeout=300s

          echo "📊 Aplicando Filebeat..."
          kubectl apply -f k8s/filebeat.yaml
          kubectl rollout status daemonset/filebeat -n fiapx --timeout=300s

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # PROMETHEUS + GRAFANA
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Deploy Monitoring Stack
        run: |
          echo "📈 Aplicando Prometheus..."
          kubectl apply -f k8s/prometheus.yaml
          kubectl rollout status deployment/prometheus -n fiapx --timeout=300s

          echo "📈 Aplicando Grafana..."
          kubectl apply -f k8s/grafana.yaml
          kubectl rollout status deployment/grafana -n fiapx --timeout=300s

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # VERIFICAÇÃO FINAL
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Final Verification
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅  VERIFICAÇÃO FINAL DO AMBIENTE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          kubectl get storageclass
          kubectl get pvc  -n fiapx
          kubectl get pods -n fiapx
          kubectl get svc  -n fiapx
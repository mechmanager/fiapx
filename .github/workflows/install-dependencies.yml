# .github/workflows/install-dependencies.yml
name: install-dependencies

on:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: false
      POSTGRES_PASSWORD:
        required: true
      RABBITMQ_PASSWORD:
        required: true
      MINIO_ACCESS_KEY:
        required: true
      MINIO_SECRET_KEY:
        required: true
      JWT_SECRET:
        required: true
      SMTP_PASSWORD:
        required: true
      GRAFANA_ADMIN_PASSWORD:
        required: true

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: fiapx

jobs:
  install-dependencies:
    name: Install Infra Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # ── AWS credentials ────────────────────────────────────────────────────
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # ── kubeconfig ─────────────────────────────────────────────────────────
      - name: Atualizar kubeconfig para EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      # ── Namespace ──────────────────────────────────────────────────────────
      - name: Criar namespace fiapx
        run: |
          kubectl create namespace fiapx --dry-run=client -o yaml | kubectl apply -f -

      # ── Secrets ────────────────────────────────────────────────────────────
      - name: Aplicar secrets do Kubernetes
        run: |
          kubectl create secret generic fiapx-secrets \
            --namespace fiapx \
            --from-literal=postgres-password=${{ secrets.POSTGRES_PASSWORD }} \
            --from-literal=rabbitmq-password=${{ secrets.RABBITMQ_PASSWORD }} \
            --from-literal=minio-access-key=${{ secrets.MINIO_ACCESS_KEY }} \
            --from-literal=minio-secret-key=${{ secrets.MINIO_SECRET_KEY }} \
            --from-literal=jwt-secret=${{ secrets.JWT_SECRET }} \
            --from-literal=smtp-password=${{ secrets.SMTP_PASSWORD }} \
            --from-literal=grafana-admin-password=${{ secrets.GRAFANA_ADMIN_PASSWORD }} \
            --save-config \
            --dry-run=client -o yaml | kubectl apply -f -

      # ── Manifestos de infraestrutura ───────────────────────────────────────
      - name: Aplicar PostgreSQL
        run: kubectl apply -f k8s/postgres.yaml --namespace fiapx

      - name: Aplicar RabbitMQ
        run: kubectl apply -f k8s/rabbitmq.yaml --namespace fiapx

      - name: Aplicar MinIO
        run: kubectl apply -f k8s/minio.yaml --namespace fiapx

      - name: Aplicar Redis
        run: kubectl apply -f k8s/redis.yaml --namespace fiapx

      - name: Aplicar Elasticsearch
        run: kubectl apply -f k8s/elasticsearch.yaml --namespace fiapx

      - name: Aplicar Logstash
        run: kubectl apply -f k8s/logstash.yaml --namespace fiapx

      - name: Aplicar Kibana
        run: kubectl apply -f k8s/kibana.yaml --namespace fiapx

      - name: Aplicar Filebeat
        run: kubectl apply -f k8s/filebeat.yaml --namespace fiapx

      - name: Aplicar Prometheus
        run: kubectl apply -f k8s/prometheus.yaml --namespace fiapx

      - name: Aplicar Grafana
        run: kubectl apply -f k8s/grafana.yaml --namespace fiapx

      # ── Aguardar dependências críticas ─────────────────────────────────────
      - name: Aguardar dependências críticas
        run: |
          wait_for_resource() {
            local name=$1
            local ns=$2
            local timeout=$3

            echo "🔍 Verificando recurso: $name no namespace: $ns"

            if kubectl get statefulset "$name" -n "$ns" &>/dev/null; then
              echo "📦 Tipo detectado: StatefulSet"
              kubectl rollout status statefulset/"$name" \
                --namespace "$ns" \
                --timeout="${timeout}s"

            elif kubectl get deployment "$name" -n "$ns" &>/dev/null; then
              echo "📦 Tipo detectado: Deployment"
              kubectl rollout status deployment/"$name" \
                --namespace "$ns" \
                --timeout="${timeout}s"

            else
              echo "❌ Recurso '$name' não encontrado no namespace '$ns'"
              echo "📋 Recursos disponíveis:"
              kubectl get all -n "$ns"
              return 1
            fi
          }

          wait_for_resource postgres  fiapx 180
          wait_for_resource rabbitmq  fiapx 180
          wait_for_resource minio     fiapx 180
          wait_for_resource redis     fiapx 180
name: Install Dependencies

on:
  workflow_dispatch:
  workflow_call:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: fiapx
  NAMESPACE: fiapx

jobs:
  install-dependencies:
    name: 🚀 Install Infrastructure Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: ☸️ Update kubeconfig (EKS)
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      # ── NAMESPACE ──────────────────────────────
      - name: 📁 Create namespace
        run: |
          kubectl get namespace ${{ env.NAMESPACE }} \
            || kubectl create namespace ${{ env.NAMESPACE }}

      # ── SECRETS ────────────────────────────────
      - name: 🔐 Create secrets
        run: |
          kubectl create secret generic fiapx-secrets \
            --namespace=${{ env.NAMESPACE }} \
            --from-literal=postgres-password="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=rabbitmq-password="${{ secrets.RABBITMQ_PASSWORD }}" \
            --from-literal=minio-root-user="${{ secrets.MINIO_ROOT_USER }}" \
            --from-literal=minio-root-password="${{ secrets.MINIO_ROOT_PASSWORD }}" \
            --from-literal=jwt-secret="${{ secrets.JWT_SECRET }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # ── CONFIGMAP ──────────────────────────────
      - name: 🗂️ Apply ConfigMap
        run: kubectl apply -f k8s/configmap.yaml

      # ── STORAGE CLASS ──────────────────────────
      - name: 💾 Apply StorageClass
        run: |
          kubectl apply -f k8s/storage-class.yaml
          for i in $(seq 1 10); do
            kubectl get storageclass ebs-sc &>/dev/null && echo "✅ ebs-sc ready" && break
            echo "  attempt $i/10 – waiting 5s..."
            sleep 5
          done

      # ── POSTGRESQL ─────────────────────────────
      - name: 🐘 Recreate PostgreSQL StatefulSet
        run: |
          if kubectl get statefulset postgres -n ${{ env.NAMESPACE }} &>/dev/null; then
            kubectl delete statefulset postgres -n ${{ env.NAMESPACE }} --cascade=orphan
            echo "✅ Old StatefulSet removed"
          fi
          kubectl apply -f k8s/postgres.yaml

      - name: ⏳ Wait PostgreSQL
        run: |
          kubectl rollout status statefulset/postgres \
            -n ${{ env.NAMESPACE }} --timeout=300s
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=postgres
          kubectl get pvc  -n ${{ env.NAMESPACE }}

      # ── RABBITMQ ───────────────────────────────
      - name: 🐰 Recreate RabbitMQ StatefulSet
        run: |
          if kubectl get statefulset rabbitmq -n ${{ env.NAMESPACE }} &>/dev/null; then
            kubectl delete statefulset rabbitmq -n ${{ env.NAMESPACE }} --cascade=orphan
          fi
          kubectl apply -f k8s/rabbitmq.yaml

      - name: ⏳ Wait RabbitMQ
        run: |
          kubectl rollout status statefulset/rabbitmq \
            -n ${{ env.NAMESPACE }} --timeout=300s
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=rabbitmq

      # ── MINIO ──────────────────────────────────
      - name: 🪣 Recreate MinIO StatefulSet
        run: |
          if kubectl get statefulset minio -n ${{ env.NAMESPACE }} &>/dev/null; then
            kubectl delete statefulset minio -n ${{ env.NAMESPACE }} --cascade=orphan
          fi
          kubectl apply -f k8s/minio.yaml

      - name: ⏳ Wait MinIO
        run: |
          kubectl rollout status statefulset/minio \
            -n ${{ env.NAMESPACE }} --timeout=300s
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=minio

      # ── REDIS ──────────────────────────────────
      - name: 🔴 Deploy Redis
        run: kubectl apply -f k8s/redis.yaml

      - name: ⏳ Wait Redis
        run: |
          kubectl rollout status deployment/redis \
            -n ${{ env.NAMESPACE }} --timeout=180s
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=redis

      # ── ELASTICSEARCH ──────────────────────────
      - name: 🔍 Recreate Elasticsearch StatefulSet
        run: |
          if kubectl get statefulset elasticsearch -n ${{ env.NAMESPACE }} &>/dev/null; then
            kubectl delete statefulset elasticsearch -n ${{ env.NAMESPACE }} --cascade=orphan
          fi
          kubectl apply -f k8s/elasticsearch.yaml

      - name: ⏳ Wait Elasticsearch
        run: |
          kubectl rollout status statefulset/elasticsearch \
            -n ${{ env.NAMESPACE }} --timeout=300s
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=elasticsearch

      # ── LOGSTASH ───────────────────────────────
      - name: 📊 Deploy Logstash
        run: kubectl apply -f k8s/logstash.yaml

      - name: ⏳ Wait Logstash
        run: |
          kubectl rollout status deployment/logstash \
            -n ${{ env.NAMESPACE }} --timeout=300s
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=logstash

      # ── KIBANA ─────────────────────────────────
      - name: 📈 Deploy Kibana
        run: kubectl apply -f k8s/kibana.yaml

      - name: ⏳ Wait Kibana
        run: |
          kubectl rollout status deployment/kibana \
            -n ${{ env.NAMESPACE }} --timeout=300s
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=kibana

      # ── FILEBEAT ───────────────────────────────
      - name: 📂 Deploy Filebeat
        run: kubectl apply -f k8s/filebeat.yaml

      - name: ⏳ Wait Filebeat
        run: |
          kubectl rollout status daemonset/filebeat \
            -n ${{ env.NAMESPACE }} --timeout=180s
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=filebeat

      # ── PROMETHEUS ─────────────────────────────
      - name: 📡 Deploy Prometheus
        run: kubectl apply -f k8s/prometheus.yaml

      - name: ⏳ Wait Prometheus
        run: |
          kubectl rollout status deployment/prometheus \
            -n ${{ env.NAMESPACE }} --timeout=180s
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=prometheus

      # ── GRAFANA ────────────────────────────────
      - name: 📉 Deploy Grafana
        run: kubectl apply -f k8s/grafana.yaml

      - name: ⏳ Wait Grafana
        run: |
          kubectl rollout status deployment/grafana \
            -n ${{ env.NAMESPACE }} --timeout=180s
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=grafana

      # ── RESUMO ─────────────────────────────────
      - name: 📋 Final status summary
        if: always()
        run: |
          echo "════════════════════════════════════"
          echo "  📋 FIAPX Infrastructure Summary   "
          echo "════════════════════════════════════"
          echo ""
          echo "📦 Pods:"
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide
          echo ""
          echo "💾 PVCs:"
          kubectl get pvc -n ${{ env.NAMESPACE }}
          echo ""
          echo "🌐 Services:"
          kubectl get svc -n ${{ env.NAMESPACE }}
name: Install Dependencies

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'production'

jobs:
  install-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Add Helm Repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add elastic https://helm.elastic.co
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      # ✅ Usando kubectl apply com os arquivos YAML já existentes em k8s/
      - name: Create Namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Apply Secrets
        run: kubectl apply -f k8s/secrets.yaml

      - name: Apply ConfigMap
        run: kubectl apply -f k8s/configmap.yaml

      - name: Deploy PostgreSQL
        run: kubectl apply -f k8s/postgres.yaml

      - name: Deploy RabbitMQ
        run: kubectl apply -f k8s/rabbitmq.yaml

      - name: Deploy MinIO
        run: kubectl apply -f k8s/minio.yaml

      - name: Deploy Redis
        run: kubectl apply -f k8s/redis.yaml

      - name: Deploy Elasticsearch
        run: kubectl apply -f k8s/elasticsearch.yaml

      - name: Deploy Logstash
        run: kubectl apply -f k8s/logstash.yaml

      - name: Deploy Kibana
        run: kubectl apply -f k8s/kibana.yaml

      - name: Deploy Filebeat
        run: kubectl apply -f k8s/filebeat.yaml

      - name: Deploy Prometheus
        run: kubectl apply -f k8s/prometheus.yaml

      - name: Deploy Grafana
        run: kubectl apply -f k8s/grafana.yaml

      - name: Wait for Dependencies
        run: |
          kubectl rollout status deployment/postgresql -n fiap-x --timeout=120s
          kubectl rollout status deployment/rabbitmq -n fiap-x --timeout=120s
          kubectl rollout status deployment/minio -n fiap-x --timeout=120s
          kubectl rollout status deployment/redis -n fiap-x --timeout=120s
name: notification-service

on:
  push:
    branches: ["**"]
    paths:
      - "notification-service/**"
      - ".github/workflows/notification-service.yml"
  pull_request:
    paths:
      - "notification-service/**"

concurrency:
  group: notification-service-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/fiapx

jobs:
  lint-and-test:
    name: Lint e Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: notification-service/go.sum

      - name: gofmt
        run: |
          bad=$(gofmt -l ./notification-service)
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi

      - name: go vet
        working-directory: notification-service
        run: go vet ./...

      - name: Testes e cobertura
        working-directory: notification-service
        run: |
          go test -coverprofile=coverage.out ./config/... ./domain/... ./mailer/...
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,""); print $3}')
          echo "Cobertura: ${total}%"
          awk "BEGIN { exit !($total >= 80) }" || (echo "FALHA: ${total}% < 80%" && exit 1)

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadados
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-notification-service
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: ./notification-service
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

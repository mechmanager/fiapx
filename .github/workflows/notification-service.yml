name: notification-service

on:
  push:
    branches: ["**"]
    paths:
      - "notification-service/**"
      - ".github/workflows/notification-service.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente de destino"
        required: true
        default: "production"
        type: choice
        options:
          - production
concurrency:
  group: notification-service-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.23"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/fiapx-notification-service
  NAMESPACE: fiapx

jobs:
  # ────────────────────────────────────────────────
  lint-and-test:
    name: Lint e Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: notification-service/go.sum

      - name: gofmt
        run: |
          bad=$(gofmt -l ./notification-service)
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi

      - name: go vet
        working-directory: notification-service
        run: go vet ./...

      - name: Testes e cobertura
        working-directory: notification-service
        run: |
          go test -coverprofile=coverage.out \
            ./config/... ./domain/... ./service/... ./mailer/...
          total=$(go tool cover -func=coverage.out \
            | awk '/^total:/ {gsub(/%/,""); print $3}')
          echo "Cobertura: ${total}%"
          awk "BEGIN { exit !($total >= 80) }" \
            || (echo "FALHA: ${total}% < 80%" && exit 1)

  # ────────────────────────────────────────────────
  docker:
    name: Build e Push
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}          # ✅ PAT de longa duração

      - name: SHA curto
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build e Push
        uses: docker/build-push-action@v6
        with:
          context: ./notification-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────
  deploy:
    name: Deploy → fiapx
    runs-on: ubuntu-latest
    needs: docker
    # ✅ Removido: if: github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-eks-fiapx
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      CLUSTER_NAME: fiapx
      TAG: sha-${{ needs.docker.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Atualizar kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Aplicar secrets
        run: |
          kubectl create secret generic fiapx-secrets \
            --namespace fiapx \
            --from-literal=postgres-password=${{ secrets.POSTGRES_PASSWORD }} \
            --from-literal=rabbitmq-password=${{ secrets.RABBITMQ_PASSWORD }} \
            --from-literal=minio-access-key=${{ secrets.MINIO_ACCESS_KEY }} \
            --from-literal=minio-secret-key=${{ secrets.MINIO_SECRET_KEY }} \
            --from-literal=jwt-secret=${{ secrets.JWT_SECRET }} \
            --from-literal=smtp-password=${{ secrets.SMTP_PASSWORD }} \
            --from-literal=grafana-admin-password=${{ secrets.GRAFANA_ADMIN_PASSWORD }} \
            --save-config \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Criar imagePullSecret GHCR
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --namespace fiapx \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GHCR_TOKEN }} \
            --save-config \
            --dry-run=client -o yaml | kubectl apply -f -  # ✅ PAT de longa duração

      - name: Deploy
        run: |
          echo "→ Namespace : fiapx"
          echo "→ Imagem    : ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}"

          kubectl set image deployment/notification-service \
            notification-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }} \
            --namespace fiapx

          kubectl patch deployment notification-service \
            --namespace fiapx \
            --patch '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"ghcr-secret"}]}}}}'
      - name: Aplicar Deployment atualizado
        run: |
          kubectl apply -f k8s/notification-service.yaml --namespace fiapx
      - name: Aguardar rollout
        run: |
          kubectl rollout status deployment/notification-service \
            --namespace fiapx \
            --timeout=300s

      - name: Endpoint
        run: |
          LB=$(kubectl get svc notification-service \
            --namespace fiapx \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
            2>/dev/null || echo "pendente")
          echo ""
          echo "╔══════════════════════════════════════════╗"
          echo "║  Namespace : fiapx"
          echo "║  Imagem    : ${{ env.TAG }}"
          echo "║  URL       : http://$LB"
          echo "╚══════════════════════════════════════════╝"
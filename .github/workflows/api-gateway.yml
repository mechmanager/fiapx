name: api-gateway

on:
  push:
    branches: ["**"]
    paths:
      - "api-gateway/**"
      - ".github/workflows/api-gateway.yml"

concurrency:
  group: api-gateway-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.23"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/fiapx-api-gateway

jobs:
  # ────────────────────────────────────────────────
  lint-and-test:
    name: Lint e Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api-gateway/go.sum

      - name: gofmt
        run: |
          bad=$(gofmt -l ./api-gateway)
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi

      - name: go vet
        working-directory: api-gateway
        run: go vet ./...

      - name: Testes e cobertura
        working-directory: api-gateway
        run: |
          go test -coverprofile=coverage.out \
            ./config/... ./middleware/... ./proxy/...
          total=$(go tool cover -func=coverage.out \
            | awk '/^total:/ {gsub(/%/,""); print $3}')
          echo "Cobertura: ${total}%"
          awk "BEGIN { exit !($total >= 80) }" \
            || (echo "FALHA: ${total}% < 80%" && exit 1)

  # ────────────────────────────────────────────────
  docker:
    name: Build e Push
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.sha.outputs.short }}
      namespace: ${{ steps.ns.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: SHA curto
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Calcular namespace
        id: ns
        run: |
          # Sanitiza o nome da branch para uso no namespace
          # feature/minha-feature → fiapx-feature-minha-feature
          BRANCH="${{ github.ref_name }}"
          SAFE=$(echo "$BRANCH" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9-]/-/g' \
            | sed 's/--*/-/g' \
            | sed 's/^-//;s/-$//' \
            | cut -c1-40)

          if [ "$BRANCH" = "main" ]; then
            NS="fiapx-production"
          else
            NS="fiapx-${SAFE}"
          fi

          echo "name=$NS" >> "$GITHUB_OUTPUT"
          echo "→ Namespace: $NS"

      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build e Push
        uses: docker/build-push-action@v6
        with:
          context: ./api-gateway
          push: true           # ← push em TODAS as branches
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────
  deploy:
    name: Deploy → ${{ needs.docker.outputs.namespace }}
    runs-on: ubuntu-latest
    needs: docker
    concurrency:
      group: deploy-eks-${{ needs.docker.outputs.namespace }}  # ← isolado por namespace
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      CLUSTER_NAME: fiapx
      NAMESPACE: ${{ needs.docker.outputs.namespace }}
      TAG: sha-${{ needs.docker.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Atualizar kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Criar namespace se não existir
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

          # Label para identificar ambiente
          kubectl label namespace ${{ env.NAMESPACE }} \
            environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }} \
            branch=${{ github.ref_name }} \
            managed-by=github-actions \
            --overwrite

      - name: Aplicar secrets
        run: |
          kubectl create secret generic fiapx-secrets \
            --namespace ${{ env.NAMESPACE }} \
            --from-literal=postgres-password=${{ secrets.POSTGRES_PASSWORD }} \
            --from-literal=rabbitmq-password=${{ secrets.RABBITMQ_PASSWORD }} \
            --from-literal=minio-access-key=${{ secrets.MINIO_ACCESS_KEY }} \
            --from-literal=minio-secret-key=${{ secrets.MINIO_SECRET_KEY }} \
            --from-literal=jwt-secret=${{ secrets.JWT_SECRET }} \
            --from-literal=smtp-password=${{ secrets.SMTP_PASSWORD }} \
            --from-literal=grafana-admin-password=${{ secrets.GRAFANA_ADMIN_PASSWORD }} \
            --save-config \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy no namespace da branch
        run: |
          echo "→ Namespace : ${{ env.NAMESPACE }}"
          echo "→ Imagem    : ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}"

          # Aplica os manifests base no namespace correto
          kubectl apply -f k8s/api-gateway/ \
            --namespace ${{ env.NAMESPACE }}

          # Atualiza só a imagem deste serviço
          kubectl set image deployment/api-gateway \
            api-gateway=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }} \
            --namespace ${{ env.NAMESPACE }}

      - name: Aguardar rollout
        run: |
          kubectl rollout status deployment/api-gateway \
            --namespace ${{ env.NAMESPACE }} \
            --timeout=300s

      - name: 🌐 Endpoint do ambiente
        run: |
          LB=$(kubectl get svc api-gateway \
            --namespace ${{ env.NAMESPACE }} \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "pendente")
          echo ""
          echo "╔══════════════════════════════════════════╗"
          echo "║  Ambiente : ${{ env.NAMESPACE }}"
          echo "║  Branch   : ${{ github.ref_name }}"
          echo "║  Imagem   : ${{ env.TAG }}"
          echo "║  URL      : http://$LB"
          echo "╚══════════════════════════════════════════╝"